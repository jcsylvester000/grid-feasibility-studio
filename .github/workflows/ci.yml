# Continuous integration (B9): every push and pull request runs the same checks as the build batches.
# No secrets are needed: tests use an in-memory Postgres (PGlite), the mock VectorShift and local file
# storage. Netlify builds and deploys separately from the main branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit, contract and integration tests
        run: npm test
      - name: Build
        run: npx next build
      - name: JavaScript budgets (public pages)
        run: npm run check:budgets
      - name: Secret scan (repository and browser bundles)
        run: npm run scan:secrets
      - name: Dependency audit (production, critical blocks)
        run: npm run audit:prod
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (includes accessibility, budgets for signed-in pages, privacy scan)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
